# ============================================================================
# 控制策略定义 —— auto_bypass.sh / bypassctl.sh / uninstall.sh 共用，唯一来源
# 设备：Redmi Note 11T Pro (xaga) / MIUI 13 / Android 12 / kernel 5.10.66
# MT6375 充电 IC + MTK charger + 双充电泵 (cp_master / cp_slave)
# ============================================================================


# ============================================================================
# 第 1 部分：当前启用的策略 —— current_cmd + night_charging + en_power_path
# ============================================================================
#
# 三条一起写，因为单靠哪一条都有洞：
#   current_cmd     泵全速时（约 80~88%）完全无效；
#   night_charging  只在 ≥80% 时被框架理会（<80% 会一直充到 80% 才停）；
#   en_power_path   自己杀不掉泵，只决定停充之后谁给系统供电。
# 原始数据见 实测记录.md 第十四、十五节。
#
# current_cmd 仍然是状态判据（STATE_NODE）：只有它读写对称、值可回读。
# night_charging 也可回读，但语义受框架调度影响，不适合当判据。
# en_power_path 是驱动自管的（泵一起来就自己变回 0），写它属于顺手推一把。
#
# 能直接关泵的三个节点（cp_master/online、cp_slave/online、pd_cp_manager/request_ibus）
# 都是 -w 看着可写、实际 Permission denied —— 现在靠 night_charging 绕过去了。

# ---- 状态判定节点：它的值决定「当前是否处于旁路」----
STATE_NODE="/proc/mtk_battery_cmd/current_cmd"
STATE_STOP="0 1"     # 处于旁路
STATE_START="0 0"    # 正常充电

# ---- 「真旁路」还是「停充」的判据节点 ----
# en_power_path=1 → 适配器接管供电 → ibat=0（真旁路）；
# 读回 0、而电池电流明显为正，说明只停了一半（系统靠电池跑），守护进程会自动重打。
# 留空则不启用这条判定。
POWER_PATH_CHECK="/proc/mtk_battery_cmd/en_power_path"

# ---- 进入旁路 ----
# 格式：路径|写入值|说明；顺序：先表意（状态判据）→ 压泵 → 保证真旁路
# @THRESHOLD / @SC_ORIG 两个替换仍然支持（文件末尾的备用方案会用到）
#
# 两个容易误判的点：
#   1) en_power_path 偶尔写完立刻被驱动改回去。那时 write_node 会记一条 ACTION FAILED、
#      run_actions 返回非 0，下一轮（60 秒）自动重打 —— 不是故障。
#   2) 写完这一条之后，主电源路径要约 10 秒才把系统负载接过去，这期间 ibat 会短暂为正
#      （电池在补差额），看着像"停充"。判断是不是真旁路至少要看 15~20 秒。
BYPASS_ON_ACTIONS="/proc/mtk_battery_cmd/current_cmd|0 1|电池闲置（泵闲着时由它干活）
/sys/class/power_supply/battery/night_charging|1|压在充电泵（≥80% 时框架立刻停充）
/proc/mtk_battery_cmd/en_power_path|1|使能主电源路径（把停充变成真旁路）"

# ---- 退出旁路 ----
# 顺序很重要：必须先释放 night_charging，否则框架会一直卡在 80% 不再充电
BYPASS_OFF_ACTIONS="/sys/class/power_supply/battery/night_charging|0|先释放夜间充电保持
/proc/mtk_battery_cmd/current_cmd|0 0|恢复充电"

# ---- 阈值能设到多少（原始数据见 实测记录.md 第十五、二十七节）----
# 真正的前提是「快充泵有没有转起来」，而不是电量本身：
#   泵没转 → current_cmd 在任意电量都能让电池闲置（74% 实测过真旁路 ✔）
#   泵在转 → current_cmd 完全无效；night_charging 只在 ≥80% 时被框架理会，
#            所以那时只有两条路：等它自己爬到 80%，或先打一发脉冲把泵打停（见下面第 ④ 条）
# 电脑 USB 口 / 5V 慢充不走泵：任意阈值都生效（72% 实测 15 秒停）。
# DISABLE_THRESHOLD 不受限制；阈值只管"到点开始旁路"，不会把高电量放下来。

# ---- 需要上锁的节点 ----
# night_charging 属主是 system:system、权限 644，而 MIUI 充电服务就是以 system 跑的，
# 它能把模块写进去的 1 改回 0（实测 22:20 写、22:36 已变 0）。
# chmod 440 去掉 owner 写位后它就写不动了 —— 但 440 连模块自己也写不进去
# （ksu 的 root 有 CAP_FOWNER，没有 CAP_DAC_OVERRIDE），所以 write_node 的顺序只能是
# "先 chmod 644 解锁 → 写值 → 写 1 才 chmod 440"，绝不能反。
# 补一句：没能复现出"不加 chmod 就会被改回"，它属于机制上说得通的保险；
# 真正兜底的是守护进程的保活（见 auto_bypass.sh 的 lock_released）。
LOCK_NODES="/sys/class/power_supply/battery/night_charging"

# ---- <80% 的兜底：停充（保活第 ④ 条）----
# 泵全速时上面那三条都压不住它（current_cmd 绕不过泵、night_charging 要 ≥80% 才被理会）。
# 能"压住不放"的只有 usb/input_suspend：写 1 之后泵没有输入、几秒内停摆（实测 1376→3、598→1）。
# 代价：输入路径被切，手机转为电池供电（缓慢掉电）—— 这是"停充"，不是真旁路，
# 所以只在"泵在转、而且旁路确实压不住"时启用，并在电量掉到 STOPCH_MIN_CAP 时自动放弃。
#
# 为什么不是"打一发脉冲然后复原"：input_suspend 的 1→0 跳变本身就是"重新协商 PD、把泵叫回来"
# 的触发器 —— 实测脉冲只能把泵按下约 1 分钟（cp 1381→695），随后自己回到满速（见 实测记录.md 28.6）。
#
# 2026-10-07 还逐一试过其它"关快充"的杠杆，全部无效（原始数据见 实测记录.md 第二十八节）：
#   mtk_battery_cmd/set_cv、chg/constant_charge_voltage、usb/apdo_max、
#   charger/sc_tuisoc（写 100/40 读回都是 0）、enable_sc、input_current、charge_term_current。
# 留空 STOPCH_NODE = 不启用这条（例如换电脑 USB 口时不走泵，就用不上）。
STOPCH_NODE="/sys/class/power_supply/usb/input_suspend"
STOPCH_IBUS_THRESHOLD=300   # cp_ibus ≥ 这个值算"泵在转"
STOPCH_MIN_CAP=15           # 安全阀：电量 ≤ 这个值就放弃停充、恢复充电（别把电池放空）

# ---- 卸载时兜底还原的全部节点（路径|安全值）----
# night_charging 是当前策略真会写的，必须还原；后两项是给手动试过备用方案留的兜底。
RESTORE_LIST="/proc/mtk_battery_cmd/current_cmd|0 0
/sys/class/power_supply/battery/night_charging|0
/sys/class/power_supply/battery/input_suspend|0
/sys/class/power_supply/usb/input_suspend|0"


# ============================================================================
# 第 2 部分：备用节点清单（默认注释掉，换策略时参考）
# ============================================================================
#
# 一类：真旁路（电池既不充也不放，由适配器直接供电）
#   1) current_cmd            写 "0 1"/"0 0" —— 当前策略在用。单独就能把全速充电打到 0
#                             （-1.44A → 0），但泵全速时不生效（泵绕开主充电器）。
#   2) enable_sc              写 "1"/"0" —— 已弃用。曾以为它能打断 PD 快充，实测干活的是
#                             current_cmd；既不解决泵（泵全速时答案是 ans:ignore），
#                             也不是正常停充/恢复所必需，留着仅作参考。
#   3) sc_tuisoc              写 "<目标>"/"<原值>" —— 已弃用。本机原值 80，
#                             阈值也是 80 时进和出写同一个值，纯空操作。
#
# 二类：只能「停充」—— 充电停了，但电池随即转为供电（判据是 ibat 变正，而不是 0）
#   4) battery/input_suspend  写 "1"/"0" —— 有效，泵全速下也有效（ibat 转正、usb/online 掉 0）。
#   5) usb/input_suspend      写 "1"/"0" —— 有效，泵下反应最快（cp_ibus 571→3）。
#                             附带用途：1→0 会触发 PD 重新协商，能把泵"叫回来"。
#   6) battery/night_charging 写 "1"/"0"（米系专用）—— 有效，但表现是真旁路而非停充
#                             （ibat=0 且适配器继续供电）。行为随状态变化，不够稳定。
#
# 二类相对 current_cmd 的唯一优势：不受充电泵限制 —— 泵全速时写 input_suspend，
# 泵几秒内自己停摆（输入路径被切，没有可灌的负载），代价是转为电池供电。
#
# 这些 power_supply 节点写入会报 Invalid argument 但动作已生效，所以判断成败必须
# 读回节点值（run_actions 已按此改，见 auto_bypass.sh 的 write_node）。
#
# 已淘汰：charger/input_current（写 100 只中断 10~15 秒就恢复全速）；
#         en_power_path 写 0（能切主路径，但该节点由驱动自管 —— 泵在跑时读 0 仍由泵供电）。


# ============================================================================
# 第 3 部分：可直接启用的备用方案（取消注释即可用）
# 用法：把想要的方案取消注释，它会覆盖上面第 1 部分的同名变量
# ============================================================================

# ---- 方案 A：只用 current_cmd -------------------------------------------------
# 适用：电脑 USB 口 / 不支持 PD 的 5V 充电器（不走充电泵）
# 代价：原装充电头下无效
# BYPASS_ON_ACTIONS="/proc/mtk_battery_cmd/current_cmd|0 1|写旁路状态值"
# BYPASS_OFF_ACTIONS="/proc/mtk_battery_cmd/current_cmd|0 0|恢复充电"

# ---- 方案 B：只用 enable_sc + sc_tuisoc（不依赖 current_cmd）------------------
# 适用：充电头 PD 快充下也能真旁路
# 代价：状态判据要跟着改成 enable_sc，否则 auto_bypass.sh 读不到状态
# STATE_NODE="/sys/devices/platform/charger/enable_sc"
# STATE_STOP="1"
# STATE_START="0"
# BYPASS_ON_ACTIONS="/sys/devices/platform/charger/sc_tuisoc|@THRESHOLD|目标电量
# /sys/devices/platform/charger/enable_sc|1|启用 MTK 智能充电打断快充"
# BYPASS_OFF_ACTIONS="/sys/devices/platform/charger/enable_sc|0|关闭智能充电
# /sys/devices/platform/charger/sc_tuisoc|@SC_ORIG|还原原值"

# ---- 方案 C：退化成「停充」（电池会转为供电，不是真旁路）--------------------
# 适用：万一某个 MIUI 版本把 current_cmd 的口子封了，用它兜底
#
# 三个都实测过（2026-10-06，见 实测记录.md 第十四节），按可靠性排序：
# C1 / C2 最稳，主路径和泵全速下都有效；C3 表现象会变（有时是真旁路）。
#
# 启用前必读：这三个节点的写入会返回 "Invalid argument"，但动作其实已经生效
# （store 函数先改状态再返回错误）。所以判断成败必须读回节点值 ——
# auto_bypass.sh 的 write_node() 已经这么做了，别改回去看 write 的返回值。
# 另外它们的状态可回读（1/0），所以 STATE_NODE 可以直接用节点自身。
#
# 下面 3 组任选其一：

# C1: battery/input_suspend ← 推荐（泵下也有效）
# BYPASS_ON_ACTIONS="/sys/class/power_supply/battery/input_suspend|1|停充"
# BYPASS_OFF_ACTIONS="/sys/class/power_supply/battery/input_suspend|0|恢复充电"
# STATE_NODE="/sys/class/power_supply/battery/input_suspend"
# STATE_STOP="1"
# STATE_START="0"

# C2: usb/input_suspend ← 推荐（泵下反应最快）
# BYPASS_ON_ACTIONS="/sys/class/power_supply/usb/input_suspend|1|停充"
# BYPASS_OFF_ACTIONS="/sys/class/power_supply/usb/input_suspend|0|恢复充电"
# STATE_NODE="/sys/class/power_supply/usb/input_suspend"
# STATE_STOP="1"
# STATE_START="0"

# C3: battery/night_charging（米系专用） ← 表现不稳定，备用
# BYPASS_ON_ACTIONS="/sys/class/power_supply/battery/night_charging|1|停充"
# BYPASS_OFF_ACTIONS="/sys/class/power_supply/battery/night_charging|0|恢复充电"
# STATE_NODE="/sys/class/power_supply/battery/night_charging"
# STATE_STOP="1"
# STATE_START="0"
