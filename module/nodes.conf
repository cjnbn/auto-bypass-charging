# ============================================================================
#  控制策略定义 —— auto_bypass.sh / bypassctl.sh / uninstall.sh 共用，唯一来源
#  设备：Redmi Note 11T Pro (xaga) / MIUI 13 / Android 12 / kernel 5.10.66
#        MT6375 充电 IC + MTK charger + 双充电泵 (cp_master / cp_slave)
# ============================================================================


# ============================================================================
#  第 1 部分：当前启用的策略 —— current_cmd + night_charging + en_power_path
# ============================================================================
#
#  【2026-10-06 晚的重要更新】以前只写 current_cmd，现在再加两个节点。
#  原因：current_cmd 有一个改不掉的死穴 —— 充电泵全速时（约 80~88%）完全无效。
#  实测发现 night_charging 能压下充电泵，于是三条一起写，覆盖全部场景。
#  原始数据见 实测记录.md 第十五节。
#
#  ---- 为什么还用 current_cmd ----
#  它在「泵闲着」的所有场景都是主力：<80% 的 5V 直充、泵停了以后（≥89%）。
#  读写对称、值可回读，所以 STATE_NODE 仍然用它。
#
#  ---- 为什么加 night_charging（关键）----
#  它骑的是 MIUI 智能充电/夜间充电那套【以 80% 为界】的逻辑：
#    - 电量 ≥80% 时写 1 → 框架【立刻停充】，充电泵没负载、几秒内自己停摆
#      （实测 cp_ibus 585→3，甚至 -5.5A 的泵也能压下去）
#    - 电量 <80% 时写 1 → 框架【完全不理会】，会一直充到 80% 才停
#  所以它补上了 current_cmd 在 80~88% 泵窗口的那个洞。
#  ⚠️ 退出旁路时必须先把它写回 0，否则框架会把充电永久保持在 80%、不再往上充。
#
#  ---- 为什么加 en_power_path ----
#  它决定「停充之后谁给系统供电」，是「停充」和「真旁路」的分界：
#    - en_power_path=0（泵充电时驱动自动就是这个值）→ 电池供电 = 停充（ibat 转正）
#    - en_power_path=1 → 适配器供电 = 真旁路（ibat=0）
#  注意：它【自己杀不掉泵】（实测写 1 后泵照跑），只是把停充升级成真旁路。
#  它还是驱动自管的节点（泵一起来就自己变回 0），写它属于"顺手推一把"。
#
#  ---- 曾经那套「两段式」为什么不要 ----
#  早期用过 sc_tuisoc + enable_sc，理由是「用 MTK 智能充电打断 PD 快充」。
#  实测证明那两条是多余的（泵全速时重打三次也无效、阈值等于原值时纯空操作），
#  而且 MIUI 每 10 秒就写一次 enable smartcharging: 1，带着它就是跟框架对着写。
#  注意：night_charging 和 enable_sc 完全是两回事，别再混为一谈。
#
#  【仍然无解的】能直接关泵的三个节点都是 -w 显示可写、实际 Permission denied：
#    cp_master/online、cp_slave/online、pd_cp_manager/request_ibus

# ---- 状态判定节点：这个节点的值决定「当前是否处于旁路」----
# 选它的原因：唯一一个读写对称、值可回读的节点。
# （night_charging 也可回读，但它的语义受框架调度影响，不适合当状态判据。）
STATE_NODE="/proc/mtk_battery_cmd/current_cmd"
STATE_STOP="0 1"     # 处于旁路
STATE_START="0 0"    # 正常充电

# ---- 「真旁路」还是「停充」的判据节点（v12.2 新增）----
# en_power_path=1 时适配器接管系统供电 → ibat=0（真旁路）；
# 如果它读回 0、而电池电流明显为正（电池在供电），说明只停了一半 —— 系统靠电池跑。
# 守护进程据此判断"旁路其实没成"，会自动重打（见 auto_bypass.sh 的 stopped_not_bypassed）。
# 留空则不启用这条判定。
POWER_PATH_CHECK="/proc/mtk_battery_cmd/en_power_path"

# ---- 进入旁路 ----
# 格式：路径|写入值|说明
# @THRESHOLD / @SC_ORIG 两个替换仍然支持（文件末尾的备用方案会用到）
# 顺序：current_cmd 先写（它是状态判据，先表意）→ 压泵 → 保证真旁路
#
# 注意：en_power_path 是驱动自管节点，极少数情况下写完会被驱动立刻改回去
# （例如泵重新接管时）。那时 write_node 会记一条 ACTION FAILED、run_actions 返回非 0，
# 守护进程下一轮（60 秒）会自动重打 —— 属正常现象，别当成故障。
#
# ⚠️ 另一个容易误判的点（实测）：写完这一条之后，**主电源路径要约 10 秒**才真正把系统负载
# 接过去。这期间 `ibat` 会短暂为**正**（电池在补差额），看起来像"停充"而不是"真旁路"。
# **判断是否真旁路至少要看 15~20 秒**，只看前 3~6 秒会误判（详见 实测记录.md 第 18.6 节）。
BYPASS_ON_ACTIONS="/proc/mtk_battery_cmd/current_cmd|0 1|电池闲置（泵闲着时由它干活）
/sys/class/power_supply/battery/night_charging|1|压在充电泵（≥80% 时框架立刻停充）
/proc/mtk_battery_cmd/en_power_path|1|使能主电源路径（把停充变成真旁路）"

# ---- 退出旁路 ----
# 顺序很重要：必须【先】释放 night_charging，否则框架会一直卡在 80% 不再充电
BYPASS_OFF_ACTIONS="/sys/class/power_supply/battery/night_charging|0|先释放夜间充电保持
/proc/mtk_battery_cmd/current_cmd|0 0|恢复充电"

# ---- 【停充范围能自己设到多少？】实测结论（原始数据见 实测记录.md 第十五节）----
#   - 原装充电头 PD 快充：**80% 及以上都行** —— 实测 84%、86% 写 night_charging=1 都立刻停；
#     90/95 没有逐点实测，但框架条件就是"≥80"，机制上同样成立。
#     **设到 80% 以下做不到** —— 低于 80% 时框架不理 night_charging，
#     而 current_cmd 又被充电泵挡着，实际会一直充到 80% 才停（等于被兜到 80%）。
#   - 电脑 USB 口 / 5V 慢充（不走泵）：**任意阈值都生效**，因为 current_cmd
#     在 72% 实测 15 秒就停（见 README §2.2 的原始数据），它不受电量限制。
#   - DISABLE_THRESHOLD（掉到多少恢复充电）不受任何限制。
#   - 阈值是"到点才开始旁路"，不会把已经高于阈值的电量放下来。
#   - ⚠️ 例外（已在 v11.16 修掉，留此说明原因）：**拔掉充电器再插上、且当时电量低于 80%** 时，
#     如果模块还停在旁路态，框架会把充电压在 80%（因为 night_charging 还挂着）——
#     这条路径上设 90/95 不生效。v11.16 起：拔充电器会【自动退出旁路】（释放 night_charging），
#     而且没有充电器时不会进入旁路，所以这条路径现在也按阈值正常走。

# ---- 需要"上锁"的节点（v11.15 新增，v11.16 修正写入顺序）----
# 为什么：night_charging 的属主是 `system:system`、权限 644，
# 而 MIUI 的充电服务就是以 `system` 身份跑的 —— 它拥有写权限，随时能把我们写的 1 改回 0。
#   实测：22:20 模块写入 1，22:36 读到已经是 0（中间没有任何脚本/命令碰过它）。
#
# ⚠️⚠️ 关键：**chmod 440 之后连我们自己都写不进去**。
#   实测 ksu 的 root 有 CAP_FOWNER（能 chmod），但**没有 CAP_DAC_OVERRIDE** ——
#   往 440 的文件里写会直接 `Permission denied`，节点会被卡死在 1。
#   所以 write_node() 的写法是【先 chmod 644 解锁 → 写值 → 写 1 才 chmod 440】。
#   **顺序绝不能反**；酷安帖子里"关的时候先 chmod 660 再写 0"就是这个原因。
#
# ⚠️ 但要如实说明：我们**没能复现出"不加 chmod 就会被改回"**（不加时观察 5 分钟没问题，
#    加锁后观察 10 分钟也没问题）。所以 chmod 是"按原作者做法 + 机制上说得通"的保险，
#    不是已被证实的必要条件。真正兜底的是守护进程的自愈（见 auto_bypass.sh 的 lock_released）。
#
# 规则：写入 1 后 chmod 440（上锁）；写 0 时先 chmod 644 再写（解锁并还原）。
#       退出旁路 / 卸载时都会还原成 644，不会把 MIUI 的夜间充电永久挡在外面。
LOCK_NODES="/sys/class/power_supply/battery/night_charging"

# ---- 卸载时兜底还原的全部节点（路径|安全值）----
# 本策略不再碰 enable_sc / sc_tuisoc，所以也不用还原它们；
# night_charging 是当前策略真的会写的，必须还原；
# 后面两项是给「用户手动试过备用方案（二类节点）」留的兜底。
RESTORE_LIST="/proc/mtk_battery_cmd/current_cmd|0 0
/sys/class/power_supply/battery/night_charging|0
/sys/class/power_supply/battery/input_suspend|0
/sys/class/power_supply/usb/input_suspend|0"


# ============================================================================
#  第 2 部分：备用节点清单（当前【注释掉不启用】）
# ============================================================================
#
#  【一类】真旁路 —— 电池既不充也不放，手机由适配器直接供电
#
#   1) /proc/mtk_battery_cmd/current_cmd           写 "0 1" / "0 0"
#      【当前策略，唯一在用】
#      "0 1" 单独就能把全速充电打到 0（实测在 enable_sc=0、sc_tuisoc=95 的
#      干净状态下，-1.44A → 0；写回 "0 0" 立刻恢复 -1.36A）。
#      限制：充电泵全速时不生效（泵绕开主充电器），泵停后立即生效。
#
#   2) /sys/devices/platform/charger/enable_sc     写 "1" / "0"
#      【已弃用】曾以为它能打断 PD 快充；实测是 current_cmd 在干活。
#      它既不解决充电泵（泵全速时答案是 ans:ignore），也不是正常停充/恢复
#      所必需。留着仅作参考。
#
#   3) /sys/devices/platform/charger/sc_tuisoc     写 "<目标电量>" / "<原值>"
#      【已弃用】原本与 enable_sc 配套。本机原值 80（MIUI 夜间充电目标），
#      阈值也恰好是 80 时，进和出写的都是 80，是纯粹的空操作。
#
#  【二类】只能「停充」—— 充电会停，但电池随即转为供电，不是真旁路
#         判据：写完之后电池电流变正（放电），而不是 0
#
#   ⚠️ 2026-10-06 逐项实测后的重要更正（原始数据见 实测记录.md 第十四节）：
#      1) 【二类节点不受充电泵限制】—— 这是它相对 current_cmd 的唯一优势。
#         泵全速时写 input_suspend，泵会在几秒内自己停摆（cp_ibus 598→1），
#         因为电池输入路径被切，泵没有可灌的负载。代价是转为电池供电。
#      2) 这些 power_supply 类节点【写入会报 Invalid argument 但动作已生效】，
#         所以判断成败必须读回节点值，不能看 write 的返回值
#         （run_actions 已按此改，见 auto_bypass.sh 的 write_node）。
#
#   4) /sys/class/power_supply/battery/input_suspend   写 "1" / "0"
#      ✅ 有效。ibat 转正（+43~+760mA），usb/online 掉 0。泵全速下同样有效。
#
#   5) /sys/class/power_supply/usb/input_suspend       写 "1" / "0"
#      ✅ 有效，泵下反应最快（cp_ibus 571→3 立刻）。
#      附带用途：1→0 会触发 PD 重新协商，可用于把充电泵"叫回来"（88~90% 时好用）。
#
#   6) /sys/class/power_supply/battery/night_charging  写 "1" / "0"（米系专用）
#      ✅ 有效，但表现是【真旁路】而非停充：ibat=0 且 usb/online=1、适配器继续供电
#      （2026-10-06 复现 2 次）。旧记录曾测到 +488mA（停充）与"电脑口 70% 时无效"
#      → 行为随状态变化，不稳定；泵全速下的表现尚未验证。
#
#   已淘汰的两个（实测无效/不可靠，2026-10-06）：
#     charger/input_current   写 100 只中断 10~15 秒就恢复全速，限制根本没生效
#     en_power_path           写 0 能切主路径，但该节点由驱动自管
#                             （泵在跑时读 0 却仍由泵供电，值随路径切换被改写）


# ============================================================================
#  第 3 部分：可直接启用的备用方案（取消注释即可用）
#  用法：把想要的方案取消注释，它会覆盖上面第 1 部分的同名变量
# ============================================================================

# ---- 方案 A：只用 current_cmd -------------------------------------------------
# 适用：电脑 USB 口 / 不支持 PD 的 5V 充电器（不走充电泵）
# 代价：原装充电头下【无效】
# BYPASS_ON_ACTIONS="/proc/mtk_battery_cmd/current_cmd|0 1|写旁路状态值"
# BYPASS_OFF_ACTIONS="/proc/mtk_battery_cmd/current_cmd|0 0|恢复充电"

# ---- 方案 B：只用 enable_sc + sc_tuisoc（不依赖 current_cmd）------------------
# 适用：充电头 PD 快充下也能真旁路
# 代价：状态判据要跟着改成 enable_sc，否则 auto_bypass.sh 读不到状态
# STATE_NODE="/sys/devices/platform/charger/enable_sc"
# STATE_STOP="1"
# STATE_START="0"
# BYPASS_ON_ACTIONS="/sys/devices/platform/charger/sc_tuisoc|@THRESHOLD|目标电量
# /sys/devices/platform/charger/enable_sc|1|启用 MTK 智能充电打断快充"
# BYPASS_OFF_ACTIONS="/sys/devices/platform/charger/enable_sc|0|关闭智能充电
# /sys/devices/platform/charger/sc_tuisoc|@SC_ORIG|还原原值"

# ---- 方案 C：退化成「停充」（电池会转为供电，不是真旁路）--------------------
# 适用：万一某个 MIUI 版本把 current_cmd 的口子封了，用它兜底
#
# 三个都实测过（2026-10-06，见 实测记录.md 第十四节），按可靠性排序：
#   C1 / C2 最稳，主路径和泵全速下都有效；C3 表现象会变（有时是真旁路）。
#
# ⚠️ 启用前必读：这三个节点的写入会返回 "Invalid argument"，但动作其实已经生效
#    （store 函数先改状态再返回错误）。所以判断成败必须读回节点值 —— 
#    auto_bypass.sh 的 write_node() 已经这么做了，别改回去看 write 的返回值。
#    另外它们的状态可回读（1/0），所以 STATE_NODE 可以直接用节点自身。
#
# 下面 3 组任选其一：

# C1: battery/input_suspend   ← 推荐（泵下也有效）
# BYPASS_ON_ACTIONS="/sys/class/power_supply/battery/input_suspend|1|停充"
# BYPASS_OFF_ACTIONS="/sys/class/power_supply/battery/input_suspend|0|恢复充电"
# STATE_NODE="/sys/class/power_supply/battery/input_suspend"
# STATE_STOP="1"
# STATE_START="0"

# C2: usb/input_suspend       ← 推荐（泵下反应最快）
# BYPASS_ON_ACTIONS="/sys/class/power_supply/usb/input_suspend|1|停充"
# BYPASS_OFF_ACTIONS="/sys/class/power_supply/usb/input_suspend|0|恢复充电"
# STATE_NODE="/sys/class/power_supply/usb/input_suspend"
# STATE_STOP="1"
# STATE_START="0"

# C3: battery/night_charging（米系专用）  ← 表现不稳定，备用
# BYPASS_ON_ACTIONS="/sys/class/power_supply/battery/night_charging|1|停充"
# BYPASS_OFF_ACTIONS="/sys/class/power_supply/battery/night_charging|0|恢复充电"
# STATE_NODE="/sys/class/power_supply/battery/night_charging"
# STATE_STOP="1"
# STATE_START="0"
